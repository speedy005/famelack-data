name: Sync fork with upstream (preserve my changes)

on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizza con upstream (mantiene le tue modifiche)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/famelack/famelack-data.git
          git fetch upstream
          git checkout main
          git merge upstream/main -X ours --no-edit || {
            git checkout --ours .
            git add .
            git commit -m "Merge forzato (ours)" || true
          }
          git push origin main
